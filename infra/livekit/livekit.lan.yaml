# Phase 0 / LAN-only LiveKit config (used by docker-compose.lan.yml instead of ./livekit.yaml).
# Host networking, advertises the VM's LAN IP, no TURN (coturn skipped on the LAN).
port: 7880                    # HTTP/WS signaling; also proxied by Caddy at ws://10.225.30.31/rtc
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50999
  use_external_ip: false
  node_ip: 10.225.30.31       # LAN testing only; prod uses NODE_IP=APP_PUBLIC_IP
  interfaces:
    includes:
      - ens160                # VM's only real NIC (skip docker0 / br-* bridges)

turn:
  enabled: false

redis:
  address: 127.0.0.1:6379

room:
  empty_timeout: 300
  max_participants: 4
