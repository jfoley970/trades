# coturn: TURN/STUN for clients behind strict NAT.
# Secret, realm, external-ip, listening-ip are passed on the command line from .env (docker-compose.yml).
# TLS cert: the Caddy wildcard (*.advancedsettings.cloud), exported by infra/scripts/export-certs.sh.
listening-port=3478
tls-listening-port=5349
# Option: dedicated public IP for coturn so TURN/TLS can use 443 (passes most restrictive firewalls).
# Then run coturn bound to TURN_LAN_IP only and use:
#   tls-listening-port=443
#   alt-tls-listening-port=5349
min-port=49160
max-port=49200                  # small relay range for a home cluster; open the same range at the edge + ufw
fingerprint
use-auth-secret                 # TURN REST creds; LiveKit mints them from the same secret
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# Never relay into private/home networks (stops TURN being used to pivot into 10.225.30.0/24 etc.)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
total-quota=100
stale-nonce=600
log-file=stdout
